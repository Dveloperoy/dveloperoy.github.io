<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dveloperoy | Developer</title>

    <meta name="description" content="Dveloperoy — Developer & Security Researcher">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            overflow: hidden;

            background:
                radial-gradient(circle at top, #1c1c1c, #050505 55%);

            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* Animated background */
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #A6E22C;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 8px #A6E22C;

            animation: float 8s linear infinite;
        }

        .particle:nth-child(1)  { left: 5%;  animation-delay: 0s; }
        .particle:nth-child(2)  { left: 15%; animation-delay: 2s; }
        .particle:nth-child(3)  { left: 25%; animation-delay: 5s; }
        .particle:nth-child(4)  { left: 35%; animation-delay: 1s; }
        .particle:nth-child(5)  { left: 45%; animation-delay: 4s; }
        .particle:nth-child(6)  { left: 55%; animation-delay: 7s; }
        .particle:nth-child(7)  { left: 65%; animation-delay: 3s; }
        .particle:nth-child(8)  { left: 75%; animation-delay: 6s; }
        .particle:nth-child(9)  { left: 85%; animation-delay: 2.5s; }
        .particle:nth-child(10) { left: 95%; animation-delay: 4.5s; }

        @keyframes float {
            0% {
                transform: translateY(110vh) translateX(0);
                opacity: 0;
            }

            15% {
                opacity: 0.45;
            }

            50% {
                transform: translateY(50vh) translateX(25px);
                opacity: 0.25;
            }

            85% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-10vh) translateX(-20px);
                opacity: 0;
            }
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 520px;
            padding: 40px 28px;
            text-align: center;

            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.5),
                0 0 50px rgba(166,226,44,0.03);
        }

        .avatar {
            width: 95px;
            height: 95px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #A6E22C;
            color: #000;

            font-size: 35px;
            font-weight: bold;

            box-shadow:
                0 0 25px rgba(166,226,44,0.20),
                0 0 60px rgba(166,226,44,0.08);

            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow:
                    0 0 25px rgba(166,226,44,0.20),
                    0 0 60px rgba(166,226,44,0.08);
            }

            50% {
                box-shadow:
                    0 0 35px rgba(166,226,44,0.35),
                    0 0 80px rgba(166,226,44,0.12);
            }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .role {
            color: #A6E22C;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .line {
            width: 60px;
            height: 2px;
            background: #A6E22C;
            margin: 0 auto 25px;

            box-shadow: 0 0 10px rgba(166,226,44,0.35);
        }

        .info {
            text-align: left;
        }

        .item {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            color: #eee;
            font-size: 16px;
        }

        .footer {
            margin-top: 28px;
            color: #666;
            font-size: 12px;
        }

        .accent {
            color: #A6E22C;
        }

    </style>
</head>

<body>

    <!-- Background particles -->
    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <!-- Main profile -->
    <div class="card">

        <div class="avatar">
            D
        </div>

        <h1>Dveloperoy</h1>

        <div class="role">
            Developer & Security Researcher
        </div>

        <div class="line"></div>

        <div class="info">

            <div class="item">
                <span class="label">Owner</span>
                <span class="value">Dveloperoy</span>
            </div>

            <div class="item">
                <span class="label">Role</span>
                <span class="value">Developer & Security Researcher</span>
            </div>

            <div class="item">
                <span class="label">Project</span>
                <span class="value">PraiemOx</span>
            </div>

            <div class="item">
                <span class="label">Focus</span>
                <span class="value">Android • Software • Security</span>
            </div>

        </div>

        <div class="footer">
            <span class="accent">@Dveloperoy</span> · © 2026
        </div>

    </div>

</body>
</html>
